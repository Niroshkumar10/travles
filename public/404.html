<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wayfarer Travel</title>
    <script type="text/javascript">
      // SPA fallback for GitHub Pages: encodes the requested path into a query
      // string and redirects to index.html, which decodes it back via
      // history.replaceState before the router mounts. Standard pattern for
      // hosting a client-side-routed app on GitHub Pages with clean URLs.
      // See: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
